name: spacerocks
on:
  push:
    branches: ['v3', 'v4']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test

  python:
    name: Python bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: py_spacerocks
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and install
        working-directory: py_spacerocks
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin numpy pytest
          maturin develop --release
      - name: pytest
        working-directory: py_spacerocks
        run: |
          . .venv/bin/activate
          pytest -q tests
