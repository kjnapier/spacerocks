[package]
name = "py_spacerocks"
version = "3.0.0-alpha.0"
edition = "2021"

[lib]
name = "spacerocks"
crate-type = ["cdylib"]

[dependencies]
spacerocks = { path = "../" }
pyo3 = { version = "0.29", features = ["extension-module"] }

numpy = "0.29"
rayon = "1.10"
nalgebra = "0.32.2"

# arrow = "40.0" 
flate2 = "1.0"
serde_json = "1.0.68"
serde = { version = "1.0.197", features = ["derive", "rc"]}
reqwest = { version = "0.11.4", features = ["json", "blocking"] }
anyhow = "1"
dirs = "6"

# Cargo's release default (strip = "debuginfo") runs rustc's bundled
# rust-objcopy on macOS, which before Rust 1.98 leaves __LINKEDIT 4-byte
# aligned; macOS 27's dyld then refuses to load the extension with
# "mis-aligned LINKEDIT string pool". Skip stripping so any toolchain works.
[profile.release]
strip = false
