<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulation Monitor</title>
<link rel="icon" href="data:,">
<style>
/* Everything is drawn like an 8-bit console: one 5x7 pixel font (served as font.ttf) at multiples
   of 8 px so its pixels stay square, an NES-like palette, and RPG-style windows with double
   borders. */
@font-face { font-family: "Spacerocks Pixel"; src: url("font.ttf") format("truetype"); font-display: block; }
:root {
  --bg: #0c0c24; --window: #000000; --text: #fcfcfc; --muted: #8c8cd8; --line: #fcfcfc;
  --accent: #f8b800; --good: #58d854; --warn: #f8b800; --bad: #f83800; --cyan: #3cbcfc;
  --px: 2px; color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/24px "Spacerocks Pixel", ui-monospace, monospace; text-transform: uppercase;
  -webkit-font-smoothing: none; font-smooth: never; text-rendering: optimizeSpeed;
  background-image: radial-gradient(#3c3c7c 1px, transparent 1px), radial-gradient(#26265c 1px, transparent 1px);
  background-size: 96px 96px, 56px 56px; background-position: 0 0, 28px 40px;
}
::selection { background: var(--accent); color: #000; }
main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 40px; }
header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
h1 { font-size: 32px; line-height: 40px; font-weight: normal; margin: 0; color: var(--accent); text-shadow: 4px 4px 0 #000; }
.pill { color: var(--muted); }
.pill::before { content: "▶ "; }
.pill.running { color: var(--good); }
.pill.paused { color: var(--warn); animation: blink 1s steps(2, start) infinite; }
.pill.done { color: var(--cyan); }
.pill.stopped { color: var(--bad); }
.pill.lost { color: var(--bad); animation: blink 1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }
.sub { color: var(--muted); margin-left: auto; text-align: right; }

/* A window: black, with a white double border and a title sitting on the top border. */
.panel {
  position: relative; background: var(--window); padding: 20px 20px 18px;
  border: 8px double var(--line); box-shadow: 6px 6px 0 #000;
}
.panel[data-title] { margin-top: 12px; }
.panel[data-title]::before {
  content: attr(data-title); position: absolute; top: -18px; left: 16px;
  background: var(--window); color: var(--accent); padding: 0 8px; line-height: 24px;
}
section + section { margin-top: 24px; }

.progress .row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.pct { font-size: 48px; line-height: 56px; color: var(--text); }
/* An HP-style bar of square blocks. */
.bar { height: 28px; border: 4px solid var(--line); padding: 4px; margin: 12px 0 16px; background: #000; }
.bar > div {
  height: 100%; width: 0;
  background: repeating-linear-gradient(90deg, var(--good) 0 12px, transparent 12px 16px);
}
.bar.indeterminate > div { width: 25%; animation: crawl 2s steps(20) infinite; }
@keyframes crawl { from { margin-left: 0; } to { margin-left: 75%; } }
.epochs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; }
.label { color: var(--muted); }
.value { color: var(--text); overflow-wrap: anywhere; }

.controls {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px;
  margin-top: 20px; padding-top: 20px; border-top: 4px dotted #26265c;
}
.controls .spacer { flex: 1; }
button, select, input {
  font: inherit; text-transform: uppercase; color: var(--text); background: #000;
  border: 4px solid var(--line); border-radius: 0; padding: 4px 12px; min-height: 40px;
  box-shadow: 4px 4px 0 #26265c; outline: none;
}
button { cursor: pointer; }
button:hover, button:focus-visible { background: var(--text); color: #000; }
button:active { transform: translate(4px, 4px); box-shadow: none; }
button.primary { background: var(--accent); border-color: var(--accent); color: #000; min-width: 128px; }
button.primary:hover { background: var(--text); border-color: var(--text); }
select { appearance: none; -webkit-appearance: none; padding-right: 36px; cursor: pointer; }
.select { position: relative; display: inline-block; }
.select::after { content: "▼"; position: absolute; right: 12px; top: 8px; pointer-events: none; }
select:focus-visible, input:focus { border-color: var(--accent); }
input { width: 120px; color: var(--accent); caret-color: var(--accent); }
input::placeholder { color: #4c4c8c; }
label.inline { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.msg { color: var(--bad); }
kbd { font: inherit; border: 2px solid var(--muted); padding: 0 4px; color: var(--muted); }
.keys { color: var(--muted); }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.stat { padding: 12px 16px; }
.stat .value { font-size: 24px; line-height: 32px; margin-top: 4px; }
.stat:nth-child(1) .value, .stat:nth-child(5) .value { color: var(--cyan); }
.stat:nth-child(8) .value { color: var(--good); }

.plots { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.hint { color: var(--muted); }
/* The plots are low-resolution canvases blown up without smoothing. */
.screen { position: relative; background: #0c0c24; border: 4px solid #26265c; }
canvas.pixel {
  width: 100%; height: auto; display: block;
  image-rendering: pixelated; image-rendering: crisp-edges;
}
.tip {
  position: absolute; pointer-events: none; display: none; z-index: 2;
  background: #000; color: var(--text); border: 4px solid var(--text); box-shadow: 4px 4px 0 #000;
  font: 16px/24px "Spacerocks Pixel", monospace; padding: 4px 10px; white-space: pre;
}
.plots .caption { color: var(--muted); margin: 0 0 12px; }

.tracker .head { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; margin-bottom: 16px; }
.tracker .head .hint { margin-right: auto; }
.tracker .body { display: grid; grid-template-columns: minmax(240px, 1fr) 2fr; gap: 20px; align-items: start; }
.tracker dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 0 16px; }
.tracker dt { color: var(--muted); text-transform: none; } /* keeps ω (the font draws a-z as capitals anyway) */
.tracker dt.hint { grid-column: 1 / -1; }
.tracker dd { margin: 0; text-align: right; }
.tracker input { width: 200px; }

@media (max-width: 720px) {
  h1 { font-size: 24px; line-height: 32px; }
  .pct { font-size: 32px; line-height: 40px; }
  .plots, .tracker .body, .epochs { grid-template-columns: 1fr; }
  .stats { grid-template-columns: 1fr 1fr; gap: 16px; }
  .stat .value { font-size: 16px; line-height: 24px; }
  .panel { padding: 16px 12px 14px; }
  .sub { margin-left: 0; text-align: left; }
  .keys { display: none; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>Spacerocks</h1>
    <span id="state" class="pill">connecting</span>
    <span id="frame" class="sub"></span>
  </header>

  <section class="panel progress" data-title="Progress">
    <div class="row">
      <span class="pct" id="pct">–</span>
      <span class="sub" id="eta"></span>
    </div>
    <div class="bar" id="bar"><div></div></div>
    <div class="epochs">
      <div><div class="label">Now (TDB)</div><div class="value" id="now">–</div></div>
      <div><div class="label">Target (TDB)</div><div class="value" id="target">–</div></div>
    </div>
    <div class="controls">
      <button class="primary" id="pause" title="Pause or resume (space)">Pause</button>
      <button id="step" title="Take one step, then pause (.)">Step</button>
      <span class="keys"><kbd>Space</kbd> <kbd>.</kbd></span>
      <span class="spacer"></span>
      <label class="inline">Integrator
        <span class="select"><select id="integratorSel">
          <option>IAS15</option><option>WisdomHolman</option><option>Leapfrog</option><option>Trace</option>
        </select></span>
      </label>
      <label class="inline">dt (d) <input id="timestepIn" type="number" step="any"></label>
      <button id="apply">Apply</button>
      <span class="msg" id="msg"></span>
    </div>
  </section>

  <section class="stats">
    <div class="panel stat"><div class="label">Steps</div><div class="value" id="steps">–</div></div>
    <div class="panel stat"><div class="label">Steps / sec</div><div class="value" id="rate">–</div></div>
    <div class="panel stat"><div class="label">Timestep (d)</div><div class="value" id="dt">–</div></div>
    <div class="panel stat"><div class="label">Days / sec</div><div class="value" id="speed">–</div></div>
    <div class="panel stat"><div class="label">Time (running)</div><div class="value" id="elapsed">–</div></div>
    <div class="panel stat"><div class="label">Bodies (massive)</div><div class="value" id="np">–</div></div>
    <div class="panel stat"><div class="label">Integrator</div><div class="value" id="integrator">–</div></div>
    <div class="panel stat"><div class="label">ΔE / E₀</div><div class="value" id="de">–</div></div>
  </section>

  <section class="plots">
    <div class="panel" data-title="Map · x–y plane">
      <p class="caption">Hover a body · click to track</p>
      <div class="screen"><canvas class="pixel" id="orbits" width="224" height="224"></canvas><div class="tip" id="tip"></div></div></div>
    <div class="panel" data-title="Energy error">
      <p class="caption">Massive bodies, log scale</p>
      <div class="screen"><canvas class="pixel" id="energy" width="224" height="224"></canvas></div></div>
  </section>

  <section class="panel tracker" data-title="Orbital elements">
    <div class="head">
      <span class="hint">Track a body</span>
      <input id="trackIn" list="names" placeholder="name">
      <datalist id="names"></datalist>
      <button id="trackBtn">Track</button>
      <button id="untrackBtn">Stop</button>
    </div>
    <div class="body">
      <dl id="elements"><dt class="hint">Click a body on the map, or type its name.</dt></dl>
      <div class="screen"><canvas class="pixel" id="elementPlot" width="224" height="132"></canvas></div>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

function calendar(jd) {
  const d = new Date((jd - 2440587.5) * 86400000);
  if (isNaN(d)) return "";
  const y = d.getUTCFullYear();
  if (y < 0 || y > 9999) return `year ${y.toLocaleString()}`;
  return d.toISOString().replace("T", " ").slice(0, 19);
}
function epochText(jd) { return `JD ${jd.toFixed(5)} · ${calendar(jd)}`; }
function duration(s) {
  if (!isFinite(s) || s < 0) return "–";
  if (s < 60) return `${s.toFixed(1)} s`;
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60);
  return h ? `${h}h ${String(m).padStart(2, "0")}m` : `${m}m ${String(sec).padStart(2, "0")}s`;
}
function sci(x) { return x === 0 ? "0" : x.toExponential(2); }
function fmtDays(x) {
  const a = Math.abs(x);
  return a !== 0 && (a < 1e-3 || a >= 1e5) ? x.toExponential(3) : x.toPrecision(4);
}

// --- Pixel drawing -----------------------------------------------------------------------------
// A small NES-like palette and a 3x5 bitmap font, drawn one pixel at a time.
const PAL = {
  bg: "#0c0c24", grid: "#26265c", dim: "#5c5ca8", text: "#fcfcfc", star: "#3c3c7c",
  sun: "#f8b800", tp: "#7cd8fc", tracked: "#f83800", orbit: "#f87858",
  energy: "#58f898", series: ["#fca044", "#58f898", "#d878f8"],
  planets: ["#f87858", "#58d854", "#6888fc", "#f878f8", "#fca044", "#00e8d8", "#bcbcbc"],
};
const GLYPHS = {};
`0 111101101101111|1 010110010010111|2 111001111100111|3 111001111001111|4 101101111001001
5 111100111001111|6 111100111101111|7 111001001010010|8 111101111101111|9 111101111001111
A 010101111101101|B 110101110101110|C 011100100100011|D 110101101101110|E 111100110100111
F 111100110100100|G 011100101101011|H 101101111101101|I 111010010010111|J 001001001101010
K 101101110101101|L 100100100100111|M 101111111101101|N 110101101101101|O 010101101101010
P 110101110100100|Q 010101101110011|R 110101110101101|S 011100010001110|T 111010010010010
U 101101101101111|V 101101101101010|W 101101111111101|X 101101010101101|Y 101101010010010
Z 111001010100111|. 000000000000010|- 000000111000000|+ 000010111010000|: 000010000010000
/ 001001010100100|± 010111010000111|( 010100100100010|) 010001001001010|% 101001010100101
_ 000000000000111|' 010010000000000|= 000111000111000|° 010101010000000`.split(/[|\n]/).forEach(g => { GLYPHS[g[0]] = g.slice(2); });

function screen(id) {
  const c = $(id), ctx = c.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, c.width, c.height);
  return [ctx, c.width, c.height];
}
function px(ctx, x, y, color, size = 1) {
  ctx.fillStyle = color; ctx.fillRect(Math.round(x), Math.round(y), size, size);
}
function text(ctx, str, x, y, color = PAL.text) {
  ctx.fillStyle = color;
  x = Math.round(x); y = Math.round(y);
  for (const ch of String(str).toUpperCase()) {
    const g = GLYPHS[ch];
    if (g) for (let i = 0; i < 15; i++) if (g[i] === "1") ctx.fillRect(x + i % 3, y + Math.floor(i / 3), 1, 1);
    x += 4;
  }
}
const textWidth = str => String(str).length * 4 - 1;
function line(ctx, x0, y0, x1, y1, color) {
  // Bresenham, so lines stay one crisp pixel wide.
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  ctx.fillStyle = color;
  for (let n = 0; n < 2000; n++) {
    ctx.fillRect(x0, y0, 1, 1);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
function dotted(ctx, x0, y0, x1, y1, color) {
  ctx.fillStyle = color;
  if (y0 === y1) for (let x = x0; x <= x1; x += 2) ctx.fillRect(x, y0, 1, 1);
  else for (let y = y0; y <= y1; y += 2) ctx.fillRect(x0, y, 1, 1);
}
/// Short numbers for 4-pixel-wide characters: 3 significant figures, E notation when far from 1.
function short(x) {
  if (!isFinite(x)) return "-";
  const a = Math.abs(x);
  if (a !== 0 && (a < 1e-2 || a >= 1e5)) return x.toExponential(1).replace("e+", "E").replace("e", "E");
  return String(+x.toPrecision(3));
}
// A fixed starfield (a seeded generator, so it doesn't twinkle between frames).
const STARS = (() => { let r = 7; const n = () => (r = (r * 16807) % 2147483647) / 2147483647; return Array.from({ length: 70 }, () => [n(), n(), n() < 0.2]); })();

// --- Particles ------------------------------------------------------------------------------------
let extent = 0, drawnPoints = [], hovered = null;
function drawOrbits(s) {
  const [ctx, w, h] = screen("orbits");
  for (const [u, v, bright] of STARS) px(ctx, u * w, v * h, bright ? PAL.dim : PAL.star);
  let m = 0;
  for (const [, x, y] of s.massive) m = Math.max(m, Math.abs(x), Math.abs(y));
  for (const [, x, y] of s.test_particles) m = Math.max(m, Math.abs(x), Math.abs(y));
  m = m * 1.1 || 1;
  // Grow at once, shrink slowly, so the view doesn't jump about.
  extent = extent === 0 || m > extent ? m : extent + (m - extent) * 0.05;
  const cx = Math.floor(w / 2), cy = Math.floor(h / 2), k = (Math.min(w, h) / 2 - 2) / extent;
  const P = (x, y) => [cx + x * k, cy - y * k];
  dotted(ctx, 0, cy, w, cy, PAL.grid); dotted(ctx, cx, 0, cx, h, PAL.grid);
  text(ctx, `±${short(extent)} AU`, 3, 3, PAL.dim);

  drawnPoints = [];
  for (const [name, x, y, z] of s.test_particles) {
    const [u, v] = P(x, y);
    px(ctx, u, v, PAL.tp);
    drawnPoints.push({ name, x, y, z, u, v, massive: false });
  }

  // The tracked particle's osculating orbit, about the central body.
  const el = s.elements, central = s.massive[0];
  if (el && el.e < 1 && el.a > 0 && central) {
    const rad = Math.PI / 180, [O, w_, I] = [el.node * rad, el.arg * rad, el.inc * rad];
    const [cO, sO, cw, sw, ci] = [Math.cos(O), Math.sin(O), Math.cos(w_), Math.sin(w_), Math.cos(I)];
    const b = el.a * Math.sqrt(1 - el.e * el.e);
    let prev = null;
    for (let j = 0; j <= 96; j++) {
      const E = 2 * Math.PI * j / 96, xo = el.a * (Math.cos(E) - el.e), yo = b * Math.sin(E);
      const X = (cO * cw - sO * sw * ci) * xo + (-cO * sw - sO * cw * ci) * yo + central[1];
      const Y = (sO * cw + cO * sw * ci) * xo + (-sO * sw + cO * cw * ci) * yo + central[2];
      const p = P(X, Y);
      if (prev && j % 2) line(ctx, prev[0], prev[1], p[0], p[1], PAL.orbit);
      prev = p;
    }
  }

  const labels = [];
  s.massive.forEach(([name, x, y, z], i) => {
    const [u, v] = P(x, y);
    const color = i === 0 ? PAL.sun : PAL.planets[(i - 1) % PAL.planets.length];
    if (i === 0) { px(ctx, u - 1, v, color, 3); ctx.fillRect(Math.round(u), Math.round(v) - 1, 1, 3); }
    else px(ctx, u - 1, v - 1, color, 2);
    if (s.massive.length <= 12) {
      // Nudge a label down past the ones already placed, so close bodies stay readable.
      const lw = textWidth(name);
      let ly = v - 6;
      while (labels.some(([lx, ly2, w2]) => u + 3 < lx + w2 + 2 && lx < u + 5 + lw && Math.abs(ly - ly2) < 7)) ly += 7;
      labels.push([u + 3, ly, lw]);
      text(ctx, name, u + 3, ly, color);
    }
    drawnPoints.push({ name, x, y, z, u, v, massive: true });
  });

  const t = drawnPoints.find(p => p.name === s.tracked);
  if (t) {
    const [u, v] = [Math.round(t.u), Math.round(t.v)];
    for (const d of [2, 3]) { px(ctx, u - d, v, PAL.tracked); px(ctx, u + d, v, PAL.tracked); px(ctx, u, v - d, PAL.tracked); px(ctx, u, v + d, PAL.tracked); }
  }
  if (hovered) {
    const p = drawnPoints.find(p => p.name === hovered);
    if (p) {
      const [u, v] = [Math.round(p.u), Math.round(p.v)];
      ctx.strokeStyle = PAL.text; ctx.lineWidth = 1; ctx.strokeRect(u - 2.5, v - 2.5, 5, 5);
    }
  }
}

// Hover a particle for its details; click it to track its elements.
function nearest(ev) {
  const c = $("orbits"), r = c.getBoundingClientRect();
  const u = (ev.clientX - r.left) / r.width * c.width, v = (ev.clientY - r.top) / r.height * c.height;
  let best = null, bd = 25;
  for (const p of drawnPoints) {
    const d = (p.u - u) ** 2 + (p.v - v) ** 2 - (p.massive ? 6 : 0);
    if (d < bd) { bd = d; best = p; }
  }
  return best;
}
$("orbits").addEventListener("mousemove", ev => {
  const p = nearest(ev), tip = $("tip");
  hovered = p ? p.name : null;
  $("orbits").style.cursor = p ? "pointer" : "default";
  if (!p) { tip.style.display = "none"; last && drawOrbits(last); return; }
  const r = Math.hypot(p.x, p.y, p.z);
  tip.textContent = `${p.name}${p.massive ? "  (massive)" : ""}\nx ${p.x.toFixed(3)}  y ${p.y.toFixed(3)}  z ${p.z.toFixed(3)}\nr ${r.toFixed(3)} AU\n${p.name === last.tracked ? "tracking" : "click to track"}`;
  const box = $("orbits").parentElement.getBoundingClientRect();
  tip.style.display = "block";
  const left = ev.clientX - box.left + 14, top = ev.clientY - box.top + 14;
  tip.style.left = `${Math.min(left, box.width - tip.offsetWidth - 4)}px`;
  tip.style.top = `${top + tip.offsetHeight > box.height ? top - tip.offsetHeight - 24 : top}px`;
  last && drawOrbits(last);
});
$("orbits").addEventListener("mouseleave", () => { hovered = null; $("tip").style.display = "none"; last && drawOrbits(last); });
$("orbits").addEventListener("click", ev => { const p = nearest(ev); if (p) track(p.name); });

// --- Energy error ---------------------------------------------------------------------------------
function drawEnergy(s) {
  const [ctx, w, h] = screen("energy");
  const pts = s.history.filter(([, e]) => e > 0);
  if (pts.length < 2) { text(ctx, "WAITING FOR STEPS...", 6, 6, PAL.dim); return; }
  const pad = { l: 26, r: 4, t: 4, b: 10 };
  const ts = pts.map(p => p[0]), ls = pts.map(p => Math.log10(p[1]));
  const t0 = Math.min(...ts), t1 = Math.max(...ts);
  let lo = Math.floor(Math.min(...ls)), hi = Math.ceil(Math.max(...ls));
  if (hi === lo) hi = lo + 1;
  const X = t => pad.l + (t - t0) / ((t1 - t0) || 1) * (w - pad.l - pad.r);
  const Y = l => pad.t + (hi - l) / (hi - lo) * (h - pad.t - pad.b);
  const every = Math.max(1, Math.ceil((hi - lo) / 6));
  for (let e = lo; e <= hi; e += every) {
    const y = Math.round(Y(e));
    dotted(ctx, pad.l, y, w - pad.r, y, PAL.grid);
    text(ctx, `1E${e}`, 2, Math.min(h - pad.b - 5, Math.max(1, y - 2)), PAL.dim);
  }
  text(ctx, `${short(t0)}D`, pad.l, h - 6, PAL.dim);
  const right = `${short(t1)}D`; text(ctx, right, w - pad.r - textWidth(right), h - 6, PAL.dim);
  let prev = null;
  for (const [t, e] of pts) {
    const p = [X(t), Y(Math.log10(e))];
    if (prev) line(ctx, prev[0], prev[1], p[0], p[1], PAL.energy);
    prev = p;
  }
}

// --- Tracked elements -----------------------------------------------------------------------------
function track(name) { control({ action: "track", name }); $("trackIn").value = name; }
$("trackBtn").onclick = () => track($("trackIn").value.trim());
$("trackIn").addEventListener("keydown", e => { if (e.key === "Enter") track($("trackIn").value.trim()); });
$("untrackBtn").onclick = () => { $("trackIn").value = ""; control({ action: "track", name: "" }); };

let knownNames = "";
function drawElements(s) {
  const names = s.massive.concat(s.test_particles).map(p => p[0]);
  const key = names.length + (names[0] || "") + (names[names.length - 1] || "");
  if (key !== knownNames) {
    knownNames = key;
    $("names").replaceChildren(...names.map(n => Object.assign(document.createElement("option"), { value: n })));
  }

  const el = s.elements, dl = $("elements");
  if (!s.tracked) dl.innerHTML = `<dt class="hint">Click a body on the map, or type its name.</dt>`;
  else if (!el) dl.innerHTML = `<dt class="hint">No elements for “${s.tracked.replace(/[<&]/g, "")}”: it isn't in the simulation, or it is the central body.</dt>`;
  else {
    const deg = x => isFinite(x) ? `${x.toFixed(3)}°` : "–";
    const rows = [
      ["Body", el.name], ["About", el.central],
      ["Semi-major a", `${el.a.toPrecision(7)} AU`], ["Ecc e", el.e.toFixed(6)], ["Incl i", deg(el.inc)],
      ["Node Ω", deg(el.node)], ["Peri ω", deg(el.arg)], ["Mean anom", deg(el.mean_anomaly)], ["True anom", deg(el.true_anomaly)],
      ["Perihelion", `${el.q.toPrecision(6)} AU`], ["Aphelion", el.big_q ? `${el.big_q.toPrecision(6)} AU` : "–"],
      ["Period", el.period ? `${(el.period / 365.25).toPrecision(6)} yr` : "unbound"], ["Distance", `${el.r.toPrecision(6)} AU`],
    ];
    dl.replaceChildren(...rows.flatMap(([k, v]) => [Object.assign(document.createElement("dt"), { textContent: k }), Object.assign(document.createElement("dd"), { textContent: v })]));
  }

  const [ctx, w, h] = screen("elementPlot");
  const hist = s.element_history;
  if (!s.tracked || hist.length === 0) { text(ctx, "NOTHING TRACKED", 6, 6, PAL.dim); return; }
  const series = [["A", 1, " AU"], ["E", 2, ""], ["I", 3, "°"]];
  const rowH = Math.floor(h / series.length);
  series.forEach(([label, col, unit], r) => {
    const y0 = r * rowH, vals = hist.map(p => p[col]);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    const flat = hi - lo < 1e-9 * Math.max(1, Math.abs(hi));
    if (flat) { lo -= 1e-9; hi += 1e-9; }
    const color = PAL.series[r], t0 = hist[0][0], t1 = hist[hist.length - 1][0];
    text(ctx, `${label} ${short(vals[vals.length - 1])}${unit}`, 3, y0 + 3, color);
    const range = flat ? "FLAT" : `${short(lo)} TO ${short(hi)}`;
    text(ctx, range, w - 3 - textWidth(range), y0 + 3, PAL.dim);
    if (r) dotted(ctx, 0, y0, w, y0, PAL.grid);
    const X = t => 3 + (t - t0) / ((t1 - t0) || 1) * (w - 6), Y = v => y0 + rowH - 3 - (v - lo) / (hi - lo) * (rowH - 13);
    let prev = null;
    for (const p of hist) {
      const q = [X(p[0]), Y(p[col])];
      if (prev) line(ctx, prev[0], prev[1], q[0], q[1], color); else px(ctx, q[0], q[1], color);
      prev = q;
    }
  });
}

async function control(params) {
  $("msg").textContent = "";
  try {
    const r = await fetch("control?" + new URLSearchParams(params), { method: "POST", headers: { "X-Spacerocks": "1" } });
    if (!r.ok) $("msg").textContent = await r.text();
  } catch (e) { $("msg").textContent = "not connected"; }
  setTimeout(pollOnce, 50);
}
let editing = false;
$("pause").onclick = () => control({ action: last && last.paused ? "resume" : "pause" });
$("step").onclick = () => control({ action: "step" });
$("apply").onclick = () => {
  editing = false;
  const name = $("integratorSel").value, h = $("timestepIn").value;
  if (last && name === last.integrator) control({ action: "timestep", timestep: h });
  else control({ action: "integrator", name, timestep: h });
};
for (const id of ["integratorSel", "timestepIn"]) {
  $(id).addEventListener("focus", () => editing = true);
  $(id).addEventListener("input", () => editing = true);
}
document.addEventListener("keydown", e => {
  if (e.target.matches("input, select")) return;
  if (e.key === " ") { e.preventDefault(); $("pause").click(); }
  else if (e.key === ".") $("step").click();
});

let last = null;
function render(s) {
  last = s;
  const pill = $("state"); pill.textContent = s.state; pill.className = `pill ${s.state}`;
  if (s.paused && s.state !== "paused") { pill.textContent = `${s.state} · paused`; pill.className = "pill paused"; }
  $("pause").textContent = s.paused ? "Resume" : "Pause";
  if (!editing) {
    if (s.integrator) $("integratorSel").value = s.integrator;
    $("timestepIn").value = s.timestep ? Math.abs(s.timestep).toPrecision(6) * 1 : "";
  }
  $("frame").textContent = s.integrator ? `${s.reference_plane} · origin ${s.origin}` : "";
  const bar = $("bar");
  if (s.t_target !== null && s.t_target !== s.t_start) {
    const f = Math.min(1, Math.max(0, (s.t - s.t_start) / (s.t_target - s.t_start)));
    bar.classList.remove("indeterminate"); bar.firstElementChild.style.width = `${(f * 100).toFixed(2)}%`;
    $("pct").textContent = `${(f * 100).toFixed(1)}%`;
    $("target").textContent = epochText(s.jd_ref + s.t_target);
    const eta = s.state === "running" && f > 0 ? s.elapsed * (1 - f) / f : NaN;
    $("eta").textContent = s.state === "done" ? "finished" : isFinite(eta) ? `about ${duration(eta)} left` : "";
  } else {
    bar.classList.toggle("indeterminate", s.state === "running");
    bar.firstElementChild.style.width = s.state === "done" ? "100%" : "";
    $("pct").textContent = s.state === "idle" ? "–" : `${fmtDays(s.t - s.t_start)} days`;
    $("target").textContent = "–"; $("eta").textContent = "";
  }
  $("now").textContent = s.jd_ref ? epochText(s.jd_ref + s.t) : "–";
  $("steps").textContent = s.steps.toLocaleString();
  $("rate").textContent = s.elapsed > 0 ? Math.round(s.steps / s.elapsed).toLocaleString() : "–";
  $("dt").textContent = fmtDays(s.timestep);
  $("speed").textContent = s.elapsed > 0 ? fmtDays(Math.abs(s.t - s.t_start) / s.elapsed) : "–";
  $("elapsed").textContent = duration(s.elapsed);
  $("np").textContent = `${s.n_particles.toLocaleString()} (${s.n_massive})`;
  $("integrator").textContent = s.integrator || "–";
  $("de").textContent = sci(s.energy_error);
  drawOrbits(s); drawEnergy(s); drawElements(s);
}

async function pollOnce() {
  const r = await fetch("progress.json", { cache: "no-store" });
  render(await r.json());
}
async function poll() {
  try {
    await pollOnce();
    setTimeout(poll, 250);
  } catch (e) {
    const pill = $("state"); pill.textContent = "disconnected"; pill.className = "pill lost";
    setTimeout(poll, 1000);
  }
}
poll();
</script>
</body>
