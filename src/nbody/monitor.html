<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulation Monitor</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --text: #1c1d1f; --muted: #6b6e75; --line: #e3e3e0;
  --accent: #3b6fd8; --track: #e8ebf2; --good: #2f8f5b; --warn: #b7791f; --bad: #c2413a;
  --dot: #8a8f99; --massive: #e08a2c;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141518; --panel: #1d1f23; --text: #e9eaec; --muted: #9a9ea6; --line: #2c2f35;
    --accent: #6d9bff; --track: #2a2e37; --good: #4cc38a; --warn: #e2b04a; --bad: #ff6b61;
    --dot: #7d838d; --massive: #f2a54a;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
main { max-width: 1080px; margin: 0 auto; padding: 20px 16px 32px; }
header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
h1 { font-size: 18px; font-weight: 600; margin: 0; }
.pill {
  font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px;
  background: var(--track); color: var(--muted); text-transform: uppercase; letter-spacing: .04em;
}
.pill.running { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
.pill.done { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.pill.lost { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.sub { color: var(--muted); font-size: 13px; margin-left: auto; text-align: right; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.progress .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.pct { font-size: 32px; font-weight: 650; font-variant-numeric: tabular-nums; }
.bar { height: 10px; background: var(--track); border-radius: 999px; overflow: hidden; margin: 10px 0 12px; }
.bar > div { height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width .25s linear; }
.bar.indeterminate > div { width: 30%; animation: slide 1.4s ease-in-out infinite; }
@keyframes slide { from { margin-left: -30%; } to { margin-left: 100%; } }
.epochs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; font-variant-numeric: tabular-nums; }
.epochs .label, .stat .label { color: var(--muted); font-size: 12px; }
.epochs .value { font-size: 15px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 12px 0; }
.stat .value { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.plots { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.plots h2 { font-size: 13px; font-weight: 600; margin: 0 0 8px; color: var(--muted); }
canvas { width: 100%; aspect-ratio: 1 / 1; display: block; }
#energy { aspect-ratio: 4 / 3; }
@media (max-width: 720px) {
  .plots { grid-template-columns: 1fr; }
  .epochs { grid-template-columns: 1fr; }
  .stats { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>Simulation</h1>
    <span id="state" class="pill">connecting</span>
    <span id="frame" class="sub"></span>
  </header>

  <section class="panel progress">
    <div class="row">
      <span class="pct" id="pct">–</span>
      <span class="sub" id="eta"></span>
    </div>
    <div class="bar" id="bar"><div></div></div>
    <div class="epochs">
      <div><div class="label">Current epoch (TDB)</div><div class="value" id="now">–</div></div>
      <div><div class="label">Target epoch (TDB)</div><div class="value" id="target">–</div></div>
    </div>
  </section>

  <section class="stats">
    <div class="panel stat"><div class="label">Steps</div><div class="value" id="steps">–</div></div>
    <div class="panel stat"><div class="label">Steps per second</div><div class="value" id="rate">–</div></div>
    <div class="panel stat"><div class="label">Timestep (days)</div><div class="value" id="dt">–</div></div>
    <div class="panel stat"><div class="label">Simulated days per second</div><div class="value" id="speed">–</div></div>
    <div class="panel stat"><div class="label">Elapsed</div><div class="value" id="elapsed">–</div></div>
    <div class="panel stat"><div class="label">Particles (massive)</div><div class="value" id="np">–</div></div>
    <div class="panel stat"><div class="label">Integrator</div><div class="value" id="integrator">–</div></div>
    <div class="panel stat"><div class="label">Energy error |ΔE/E₀|</div><div class="value" id="de">–</div></div>
  </section>

  <section class="plots">
    <div class="panel"><h2>Particles, x–y plane (AU)</h2><canvas id="orbits"></canvas></div>
    <div class="panel"><h2>Energy error of the massive bodies</h2><canvas id="energy"></canvas></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

function calendar(jd) {
  const d = new Date((jd - 2440587.5) * 86400000);
  if (isNaN(d)) return "";
  const y = d.getUTCFullYear();
  if (y < 0 || y > 9999) return `year ${y.toLocaleString()}`;
  return d.toISOString().replace("T", " ").slice(0, 19);
}
function epochText(jd) { return `JD ${jd.toFixed(5)} · ${calendar(jd)}`; }
function duration(s) {
  if (!isFinite(s) || s < 0) return "–";
  if (s < 60) return `${s.toFixed(1)} s`;
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60);
  return h ? `${h}h ${String(m).padStart(2, "0")}m` : `${m}m ${String(sec).padStart(2, "0")}s`;
}
function sci(x) { return x === 0 ? "0" : x.toExponential(2); }
function fmtDays(x) {
  const a = Math.abs(x);
  return a !== 0 && (a < 1e-3 || a >= 1e5) ? x.toExponential(3) : x.toPrecision(4);
}

function setupCanvas(c) {
  const r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr);
  const ctx = c.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [ctx, r.width, r.height];
}

let extent = 0;
function drawOrbits(s) {
  const [ctx, w, h] = setupCanvas($("orbits"));
  ctx.clearRect(0, 0, w, h);
  let m = 0;
  for (const [, x, y] of s.massive) m = Math.max(m, Math.abs(x), Math.abs(y));
  for (const [x, y] of s.test_particles) m = Math.max(m, Math.abs(x), Math.abs(y));
  m = m * 1.1 || 1;
  // Grow at once, shrink slowly, so the view doesn't jump about.
  extent = extent === 0 || m > extent ? m : extent + (m - extent) * 0.05;
  const cx = w / 2, cy = h / 2, k = Math.min(w, h) / 2 / extent;
  ctx.strokeStyle = css("--line"); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(w, cy); ctx.moveTo(cx, 0); ctx.lineTo(cx, h); ctx.stroke();
  ctx.fillStyle = css("--muted"); ctx.font = "11px system-ui, sans-serif";
  ctx.fillText(`±${extent.toPrecision(3)}`, 6, 14);
  ctx.fillStyle = css("--dot");
  for (const [x, y] of s.test_particles) ctx.fillRect(cx + x * k - 1, cy - y * k - 1, 2, 2);
  ctx.fillStyle = css("--massive");
  for (const [name, x, y] of s.massive) {
    const px = cx + x * k, py = cy - y * k;
    ctx.beginPath(); ctx.arc(px, py, 3.5, 0, 2 * Math.PI); ctx.fill();
    if (s.massive.length <= 30) { ctx.fillStyle = css("--text"); ctx.fillText(name, px + 6, py - 4); ctx.fillStyle = css("--massive"); }
  }
}

function drawEnergy(s) {
  const [ctx, w, h] = setupCanvas($("energy"));
  ctx.clearRect(0, 0, w, h);
  const pts = s.history.filter(([, e]) => e > 0);
  ctx.fillStyle = css("--muted"); ctx.font = "11px system-ui, sans-serif";
  if (pts.length < 2) { ctx.fillText("waiting for steps…", 8, 18); return; }
  const pad = { l: 44, r: 8, t: 8, b: 22 };
  const ts = pts.map(p => p[0]), ls = pts.map(p => Math.log10(p[1]));
  const t0 = Math.min(...ts), t1 = Math.max(...ts) || t0 + 1;
  let lo = Math.floor(Math.min(...ls)), hi = Math.ceil(Math.max(...ls));
  if (hi === lo) hi = lo + 1;
  const X = t => pad.l + (t - t0) / ((t1 - t0) || 1) * (w - pad.l - pad.r);
  const Y = l => pad.t + (hi - l) / (hi - lo) * (h - pad.t - pad.b);
  ctx.strokeStyle = css("--line"); ctx.lineWidth = 1;
  const every = Math.max(1, Math.ceil((hi - lo) / 6));
  for (let e = lo; e <= hi; e += every) {
    ctx.beginPath(); ctx.moveTo(pad.l, Y(e)); ctx.lineTo(w - pad.r, Y(e)); ctx.stroke();
    ctx.fillText(`1e${e}`, 4, Y(e) + 4);
  }
  ctx.fillText(`${fmtDays(t0)} d`, pad.l, h - 6);
  const right = `${fmtDays(t1)} d`; ctx.fillText(right, w - pad.r - ctx.measureText(right).width, h - 6);
  ctx.strokeStyle = css("--accent"); ctx.lineWidth = 1.5; ctx.beginPath();
  pts.forEach(([t, e], i) => { const x = X(t), y = Y(Math.log10(e)); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.stroke();
}

let last = null;
function render(s) {
  last = s;
  const pill = $("state"); pill.textContent = s.state; pill.className = `pill ${s.state}`;
  $("frame").textContent = s.integrator ? `${s.reference_plane} · origin ${s.origin}` : "";
  const bar = $("bar");
  if (s.t_target !== null && s.t_target !== s.t_start) {
    const f = Math.min(1, Math.max(0, (s.t - s.t_start) / (s.t_target - s.t_start)));
    bar.classList.remove("indeterminate"); bar.firstElementChild.style.width = `${(f * 100).toFixed(2)}%`;
    $("pct").textContent = `${(f * 100).toFixed(1)}%`;
    $("target").textContent = epochText(s.jd_ref + s.t_target);
    const eta = s.state === "running" && f > 0 ? s.elapsed * (1 - f) / f : NaN;
    $("eta").textContent = s.state === "done" ? "finished" : isFinite(eta) ? `about ${duration(eta)} left` : "";
  } else {
    bar.classList.toggle("indeterminate", s.state === "running");
    bar.firstElementChild.style.width = s.state === "done" ? "100%" : "";
    $("pct").textContent = s.state === "idle" ? "–" : `${fmtDays(s.t - s.t_start)} days`;
    $("target").textContent = "–"; $("eta").textContent = "";
  }
  $("now").textContent = s.jd_ref ? epochText(s.jd_ref + s.t) : "–";
  $("steps").textContent = s.steps.toLocaleString();
  $("rate").textContent = s.elapsed > 0 ? Math.round(s.steps / s.elapsed).toLocaleString() : "–";
  $("dt").textContent = fmtDays(s.timestep);
  $("speed").textContent = s.elapsed > 0 ? fmtDays(Math.abs(s.t - s.t_start) / s.elapsed) : "–";
  $("elapsed").textContent = duration(s.elapsed);
  $("np").textContent = `${s.n_particles.toLocaleString()} (${s.n_massive})`;
  $("integrator").textContent = s.integrator || "–";
  $("de").textContent = sci(s.energy_error);
  drawOrbits(s); drawEnergy(s);
}

async function poll() {
  try {
    const r = await fetch("progress.json", { cache: "no-store" });
    render(await r.json());
    setTimeout(poll, 250);
  } catch (e) {
    const pill = $("state"); pill.textContent = "disconnected"; pill.className = "pill lost";
    setTimeout(poll, 1000);
  }
}
window.addEventListener("resize", () => last && render(last));
poll();
</script>
</body>
</html>
